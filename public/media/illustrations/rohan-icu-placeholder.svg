<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rohan in paediatric ICU  cinematic placeholder</title>
  <desc id="desc">Placeholder commission frame. Daylit paediatric ICU. Twelve-year-old Rohan awake at centre with tracheostomy circuit and AAC within reach. Clinician seated at eye level. Samira nearby not speaking for him. Serious calm tone; no pity framing; no heroic glow.</desc>
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e6f2"/>
      <stop offset="55%" stop-color="#f3efe6"/>
      <stop offset="100%" stop-color="#c5d4c8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#day)"/>
  <rect x="40" y="40" width="880" height="400" fill="none" stroke="#1f2a24" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="78" font-family="Georgia, serif" font-size="28" fill="#1f2a24">Breathing Room  ICU still (placeholder)</text>
  <text x="60" y="112" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">Commission frame · Prompt 5 · replace with licensed illustration</text>

  <!-- Bed / Rohan block -->
  <rect x="280" y="180" width="280" height="160" rx="8" fill="#f7f4ef" stroke="#1f2a24" stroke-width="2"/>
  <text x="300" y="220" font-family="Georgia, serif" font-size="18" fill="#1f2a24">Rohan (awake)</text>
  <text x="300" y="248" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">tracheostomy ’ ventilator</text>
  <text x="300" y="270" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">cheek switch + AAC in reach</text>
  <text x="300" y="292" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">directing the conversation</text>

  <!-- Clinician -->
  <rect x="600" y="200" width="200" height="120" rx="8" fill="#e7eee8" stroke="#1f2a24" stroke-width="2"/>
  <text x="620" y="250" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f2a24">Clinician</text>
  <text x="620" y="272" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">seated at eye level</text>

  <!-- Samira -->
  <rect x="80" y="220" width="160" height="100" rx="8" fill="#efe8dc" stroke="#1f2a24" stroke-width="2"/>
  <text x="100" y="265" font-family="Segoe UI, sans-serif" font-size="14" fill="#1f2a24">Samira</text>
  <text x="100" y="287" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">present · not speaking first</text>

  <text x="60" y="480" font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2a24">Tone: serious, calm · no pity · no heroic glow · equipment present but not dominant</text>
  <text x="60" y="505" font-family="Segoe UI, sans-serif" font-size="12" fill="#555">Caption space reserved beneath final artwork</text>
</svg>
